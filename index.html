<!-- SeaThrough website. GENERATED from web/site.src.html by node web/build.mjs (edit the source, not this file): the fish, clock, feed pictures and icons are copied from store/listing (sea.js, screens.js, ui.js). -->

<style>
  /* Layout: one dive. A pinned sunlit opener where a phone floods as you scroll, then the page sinks from sunlit teal to the deep. */
  :root {
    color-scheme: light;
    --sky: #EAF6FA; --sky-2: #D2ECF4; --ink: #0B1419; --ink-2: #3D5560; --teal: #0B7285;
    --glass: #7FE0E0; --deep-text: #F1F8FA; --deep-text-2: #B7D5DF; --coral: #FF8A6B; --gold: #F5C542;
    --clay-hi: #B4DEFF; --clay: #56A5F7; --clay-lo: #2D70DA; --clay-ink: #0D3F78;
    --cream: #F6FAFF; --cream-lo: #D3E5F7; --shadow: 16 62 146;
    --sans: "Geist", "Segoe UI", system-ui, sans-serif;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--sky); }
  body { margin: 0; min-height: 100%; background: linear-gradient(180deg, var(--sky), var(--sky-2) 100vh) no-repeat var(--sky); color: var(--ink);
    font: 400 17px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; }
  html.lenis, html.lenis body { height: auto; }
  .lenis:not(.lenis-autoToggle).lenis-stopped { overflow: clip; }
  .lenis [data-lenis-prevent] { overscroll-behavior: contain; }
  a { color: inherit; }
  #sea, #fish3d, #life, #glass { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #sea { z-index: 0; } #fish3d, #life { z-index: 1; } #glass { z-index: 15; }
  #root { position: relative; z-index: 2; }
  .nogl body { background: linear-gradient(180deg, var(--sky) 0, var(--sky-2) 300vh, #2C93B0 340vh, #0B3C5A 50%, #02101C 100%); }
  .wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

  h1, h2, h3, p { margin: 0; }
  h1, h2 { font-weight: 800; letter-spacing: -0.038em; line-height: 0.98; text-wrap: balance; }
  .h1 { font-size: clamp(44px, 6.3vw, 92px); }
  .h1 > span { display: block; }
  .h2 { font-size: clamp(38px, 5vw, 70px); }
  .h3 { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
  .l2 { color: var(--teal); }
  .lead { font-size: clamp(17px, 1.45vw, 20px); line-height: 1.5; max-width: 33em; color: var(--ink-2); text-wrap: pretty; }
  .label { font: 600 12px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
  .num { font-family: var(--serif); font-weight: 450; font-variation-settings: "SOFT" 0, "WONK" 0, "opsz" 60; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .deep { color: var(--deep-text); }
  .deep .l2 { color: var(--glass); }
  .deep .lead { color: var(--deep-text-2); }
  .deep .h2 { text-shadow: 0 2px 30px rgb(0 28 48 / 0.35); }

  /* ---- clay ---- */
  .clay { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 60px; padding: 0 30px;
    border: 0; border-radius: 999px; cursor: pointer; text-decoration: none; white-space: nowrap; user-select: none; -webkit-tap-highlight-color: transparent;
    font: 700 17px/1 var(--sans); letter-spacing: -0.01em; color: #fff; text-shadow: 0 1px 1px rgb(10 40 110 / 0.35);
    background: radial-gradient(130% 150% at 30% 12%, var(--clay-hi) 0%, var(--clay) 42%, var(--clay-lo) 100%);
    box-shadow: inset 0 3px 2px rgb(255 255 255 / 0.6), inset 0 -9px 16px rgb(14 50 140 / 0.45), inset 0 12px 20px rgb(255 255 255 / 0.2),
      0 20px 32px -12px rgb(var(--shadow) / 0.7), 0 6px 12px -3px rgb(var(--shadow) / 0.35);
    transition: box-shadow 0.2s ease; }
  .clay::before { content: ""; position: absolute; left: 13%; top: 6px; width: 40%; height: 36%; border-radius: 999px; pointer-events: none;
    background: linear-gradient(180deg, rgb(255 255 255 / 0.7), rgb(255 255 255 / 0)); }
  .clay:active { box-shadow: inset 0 2px 1px rgb(255 255 255 / 0.45), inset 0 -3px 8px rgb(14 50 140 / 0.5), inset 0 8px 16px rgb(10 40 120 / 0.38),
      0 8px 16px -8px rgb(var(--shadow) / 0.7); }
  .clay-light { color: var(--clay-ink); text-shadow: none;
    background: radial-gradient(130% 150% at 30% 12%, #fff 0%, #E6F2FF 48%, #C6DDF6 100%);
    box-shadow: inset 0 3px 2px #fff, inset 0 -9px 16px rgb(60 120 200 / 0.28), 0 20px 32px -14px rgb(var(--shadow) / 0.5), 0 5px 10px rgb(var(--shadow) / 0.14); }
  .clay-light:active { box-shadow: inset 0 2px 1px #fff, inset 0 -3px 8px rgb(60 120 200 / 0.3), inset 0 8px 16px rgb(60 120 200 / 0.22), 0 8px 14px -8px rgb(var(--shadow) / 0.5); }
  .clay-sm { height: 46px; padding: 0 20px; font-size: 15px; }
  .clay:focus-visible { outline: 3px solid var(--teal); outline-offset: 4px; }
  .clay svg { flex: none; }
  .pop { position: absolute; border-radius: 50%; pointer-events: none; z-index: 2;
    background: radial-gradient(circle at 34% 30%, #fff 0 16%, rgb(255 255 255 / 0.3) 38%, rgb(255 255 255 / 0.06) 70%); box-shadow: inset 0 0 0 1.2px rgb(255 255 255 / 0.85); }
  .card { position: relative; border-radius: 30px; padding: 26px; color: var(--ink);
    background: linear-gradient(165deg, #F8FBFF 0%, #E3EEFA 58%, #D2E4F7 100%);
    box-shadow: inset 0 2px 1px #fff, inset 0 -12px 26px rgb(var(--shadow) / 0.13), inset 8px 0 18px rgb(255 255 255 / 0.45),
      0 40px 70px -36px rgb(2 20 40 / 0.8), 0 10px 24px -12px rgb(2 20 40 / 0.35); }

  /* ---- nav ---- */
  .nav { position: fixed; z-index: 20; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 14px); pointer-events: none; }
  .bar { pointer-events: auto; display: flex; align-items: center; gap: 22px; height: 64px; padding: 0 9px 0 14px; border-radius: 999px;
    background: linear-gradient(180deg, #FCFDFF, #E5F0FA); color: var(--ink);
    box-shadow: inset 0 2px 1px #fff, inset 0 -7px 14px rgb(var(--shadow) / 0.12), 0 18px 40px -18px rgb(var(--shadow) / 0.6); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 520 23px/1 var(--serif); font-variation-settings: "SOFT" 0, "WONK" 0, "opsz" 24; letter-spacing: -0.02em; }
  .links { display: flex; gap: 22px; margin-left: 10px; font-weight: 500; font-size: 15px; }
  .links a { text-decoration: none; color: var(--ink-2); }
  .links a:hover { color: var(--teal); }
  .links a:focus-visible, .brand:focus-visible, .foot a:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; border-radius: 6px; }
  .grow { flex: 1; }

  /* ---- the pinned opener ---- */
  .story { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
  .story-grid { height: 100%; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr); align-items: center; gap: 48px; padding-block: 96px 30px; }
  .copy { position: relative; min-width: 0; }
  .hero { display: grid; gap: 26px; }
  .ctas { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .fine { font: 500 14px/1.3 var(--sans); color: var(--ink-2); }
  .hint { display: flex; align-items: center; gap: 12px; margin-top: 8px; font: 600 12px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); }
  .hint i { width: 1px; height: 34px; background: linear-gradient(var(--teal), transparent); animation: hint 1.8s ease-in-out infinite; transform-origin: top; }
  @keyframes hint { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }
  .step { display: grid; gap: 20px; }
  .meter { margin-top: 34px; max-width: 420px; display: grid; gap: 10px; }
  .meter-row { display: flex; justify-content: space-between; gap: 12px; font: 500 14px/1.2 var(--sans); color: var(--ink-2); }
  .meter-row .t { font: 600 15px/1.2 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 14px; border-radius: 99px; background: linear-gradient(180deg, #D2E4EE, #E8F2F7);
    box-shadow: inset 0 3px 5px rgb(var(--shadow) / 0.18), 0 1px 0 #fff; }
  .track > i { position: absolute; left: 3px; top: 3px; bottom: 3px; border-radius: 99px; background: linear-gradient(180deg, #4FC0CF, var(--teal)); transition: background 0.3s; box-shadow: inset 0 1px 1px rgb(255 255 255 / 0.5); }
  .track > i.hot { background: linear-gradient(180deg, #FFB39E, #F0694A); }
  .track > b { position: absolute; top: -5px; bottom: -5px; width: 2px; border-radius: 2px; background: var(--ink); opacity: 0.55; }

  .phone { --ph: min(740px, calc(100svh - 140px)); justify-self: center; position: relative; height: var(--ph); width: calc(var(--ph) * 404 / 852);
    padding: calc(var(--ph) * 0.0118); border-radius: calc(var(--ph) * 0.068);
    background: linear-gradient(150deg, #34424D, #0C1216 58%, #1A242B);
    box-shadow: inset 0 1px 1px rgb(255 255 255 / 0.28), inset 0 -2px 3px rgb(0 0 0 / 0.5), 0 60px 90px -44px rgb(6 40 70 / 0.75), 0 22px 40px -22px rgb(6 40 70 / 0.5); }
  .screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: calc(var(--ph) * 0.057); background: #fff; isolation: isolate; }
  .scaled { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  .over { z-index: 3; pointer-events: none; }
  .pane { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* inside the phone: 384 x 832 dp */
  .feed { position: absolute; left: 0; top: 0; width: 384px; padding-top: 32px; background: #fff; color: #15181B; font-family: var(--sans); }
  .feed-head { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font: 700 23px/1 var(--sans); letter-spacing: -0.4px; }
  .feed-head span, .post-act { display: flex; gap: 18px; align-items: center; }
  .stories { display: flex; gap: 12px; padding: 6px 14px 12px; border-bottom: 1px solid #ECEEF0; }
  .st { width: 58px; display: flex; flex-direction: column; align-items: center; gap: 5px; font: 400 11px/14px var(--sans); color: #3A3F44; }
  .av { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--c); color: #fff; font: 600 19px/1 var(--sans); font-style: normal; }
  .av.ringed { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #E2366B; }
  .post { padding-bottom: 18px; }
  .post-head { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px; }
  .post-head .av { width: 32px; height: 32px; font-size: 13px; }
  .post-head b { display: block; font: 600 14px/18px var(--sans); }
  .post-head span { font: 400 12px/14px var(--sans); color: #6B7075; }
  .post-act { height: 46px; padding: 0 14px; }
  .post-cap { padding: 0 14px; font: 400 14px/20px var(--sans); }
  .post-cap b { font-weight: 600; }
  .home { position: absolute; inset: 0; }
  .homescr { position: absolute; inset: 0; color: #fff; font-family: var(--sans); background: radial-gradient(120% 80% at 20% 8%, #6DB4D2 0, #1F6286 46%, #0B2A3E 100%); }
  .h-clock { position: absolute; left: 0; right: 0; top: 118px; text-align: center; font: 250 86px/1 var(--sans); letter-spacing: -3px; }
  .h-grid { position: absolute; left: 26px; right: 26px; bottom: 150px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; font: 500 12.5px/16px var(--sans); }
  .h-grid div { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .sbar { position: absolute; left: 0; right: 0; top: 0; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 2px 24px 0; font: 600 14px/1 var(--sans); color: #15181B; transition: color 0.4s; }
  .sbar.light { color: #fff; }
  .sbar span { display: flex; gap: 5px; align-items: center; }
  .hu { position: absolute; left: 10px; right: 10px; top: 40px; border-radius: 24px; padding: 14px 16px 16px; background: #FAFCFD; color: #15181B;
    box-shadow: 0 14px 34px -12px rgb(0 0 0 / 0.4), 0 0 0 1px rgb(0 0 0 / 0.05); }
  .hu-top { display: flex; align-items: center; gap: 8px; font: 500 12.5px/1 var(--sans); color: #3A4248; }
  .hu-title { margin-top: 9px; font: 600 18px/22px var(--sans); font-variant-numeric: tabular-nums; }
  .talk { position: absolute; left: 48px; top: 540px; width: 236px; padding: 10px 14px; border-radius: 18px; background: #fff; color: #15181B;
    font: 500 14px/19px var(--sans); box-shadow: 0 10px 24px -10px rgb(0 40 60 / 0.45); }
  .talk::after { content: ""; position: absolute; left: 34px; bottom: -9px; border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .ring-float { position: absolute; left: 150px; top: 390px; filter: drop-shadow(0 6px 8px rgb(0 30 50 / 0.35)); animation: drift 11s ease-in-out infinite alternate; }
  @keyframes drift { 0% { transform: translate(-70px, 24px) rotate(-12deg); } 50% { transform: translate(30px, -28px) rotate(6deg); } 100% { transform: translate(96px, 36px) rotate(22deg); } }
  .ring { display: block; width: 72px; height: 72px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, rgb(255 255 255 / 0.55), transparent 42%),
      conic-gradient(#E5383B 0 45deg, #FBF7F2 0 90deg, #E5383B 0 135deg, #FBF7F2 0 180deg, #E5383B 0 225deg, #FBF7F2 0 270deg, #E5383B 0 315deg, #FBF7F2 0);
    -webkit-mask: radial-gradient(circle, transparent 0 17px, #000 18px); mask: radial-gradient(circle, transparent 0 17px, #000 18px); }

  /* ---- deep sections ---- */
  .sec { position: relative; padding-block: clamp(96px, 15vh, 170px); }
  .head { display: grid; gap: 22px; max-width: 760px; margin-bottom: clamp(40px, 6vw, 72px); }
  .vs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .vs-card { display: grid; gap: 18px; align-content: start; }
  .shot { position: relative; aspect-ratio: 360 / 441; max-width: 100%; border-radius: 22px; overflow: hidden; background: #fff; isolation: isolate;
    box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.06); }
  .shot svg { margin: 0 !important; border-radius: 0 !important; }
  .shot.locked > .scaled { filter: grayscale(1) brightness(0.55) blur(1.5px); }
  .wall { position: absolute; inset: 0; z-index: 3; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 24px; text-align: center; color: #fff;
    background: rgb(28 32 36 / 0.62); }
  .wall b { font: 700 22px/1.2 var(--sans); }
  .wall span { font: 400 15px/1.4 var(--sans); color: #D5DADD; }
  .ticks { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; font-size: 16px; }
  .ticks li { display: flex; gap: 10px; align-items: baseline; }
  .ticks li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); transform: translateY(-1px); }
  .ticks.no li::before { background: #9AA4AA; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
  .feat { display: grid; gap: 14px; align-content: start; }
  .feat p { color: var(--ink-2); font-size: 16px; }
  .viz { position: relative; height: 168px; border-radius: 20px; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 30% 0%, #3AA6C2 0%, #13658A 50%, #0A3550 100%); box-shadow: inset 0 3px 12px rgb(0 20 40 / 0.35); }
  .tag { justify-self: start; padding: 6px 10px; border-radius: 99px; background: #D6E7F7; color: var(--clay-ink); font: 600 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
  .tag.pro { background: linear-gradient(180deg, #6DB2FA, #2D70DA); color: #fff; }
  .bubble { position: absolute; left: 18px; top: 16px; max-width: 210px; padding: 9px 12px; border-radius: 16px; background: #fff; color: #15181B; font: 500 13px/17px var(--sans); }
  .bubble::after { content: ""; position: absolute; left: 30px; bottom: -8px; border: 9px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .medal { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 28%, #FFF3C2 0, #F5C542 38%, #B9861A 100%); box-shadow: inset 0 2px 2px rgb(255 255 255 / 0.7), inset 0 -6px 10px rgb(120 70 0 / 0.35), 0 10px 22px -8px rgb(0 0 0 / 0.5); }
  .gate { display: grid; gap: 10px; justify-items: center; color: #fff; text-align: center; }
  .gate small { font: 500 12px/1 var(--sans); color: #CDE7F0; }
  .gate b { font: 450 40px/1 var(--serif); font-variation-settings: "SOFT" 0, "WONK" 0, "opsz" 60; }
  .gate div { display: flex; gap: 8px; }
  .gate span { padding: 8px 12px; border-radius: 99px; font: 600 12px/1 var(--sans); background: rgb(255 255 255 / 0.16); }
  .gate span + span { background: #fff; color: #0B1419; }
  .lmi { display: grid; gap: 10px; justify-items: center; color: #fff; }
  .lmi span { padding: 11px 18px; border-radius: 99px; background: #fff; color: #0B1419; font: 700 14px/1 var(--sans); }
  .lmi small { font: 600 13px/1 var(--mono); color: #CDE7F0; letter-spacing: 0.06em; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(24px, 4vw, 56px); }
  .stat { display: grid; gap: 14px; align-content: start; padding-top: 22px; border-top: 1px solid rgb(255 255 255 / 0.22); }
  .stat .num { font-size: clamp(46px, 5.4vw, 76px); line-height: 1; color: #fff; }
  .stat .num.word { font-size: clamp(34px, 3.6vw, 50px); }
  .stat p { color: var(--deep-text-2); max-width: 22em; }
  .stat small { font: 500 12px/1.4 var(--mono); color: #86AFC0; letter-spacing: 0.04em; }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
  .facts .card p { color: var(--ink-2); font-size: 16px; margin-top: 8px; }
  .plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
  .plan { display: grid; gap: 18px; padding: 32px; }
  .plan .price { display: flex; align-items: baseline; gap: 10px; }
  .plan .price .num { font-size: 64px; line-height: 1; }
  .plan .ticks { font-size: 16px; }
  .plan.pro { color: #fff; background: radial-gradient(140% 120% at 20% 0%, #7CBDFB 0%, #3A86E6 45%, #1F55B5 100%);
    box-shadow: inset 0 3px 2px rgb(255 255 255 / 0.5), inset 0 -16px 30px rgb(10 30 100 / 0.35), 0 40px 70px -36px rgb(2 20 40 / 0.85); }
  .plan.pro .ticks li::before { background: #fff; }
  .plan.pro .sub { color: #DCEBFF; }
  .plan .sub { color: var(--ink-2); font-size: 15px; }
  .center { display: grid; justify-items: center; text-align: center; gap: 28px; }
  .final { padding-block: clamp(140px, 24vh, 260px) clamp(90px, 14vh, 150px); }
  .foot { padding-block: 40px 56px; border-top: 1px solid rgb(255 255 255 / 0.12); display: flex; flex-wrap: wrap; gap: 14px 28px; justify-content: space-between; color: #8DB1C0; font-size: 14px; }
  .foot nav { display: flex; gap: 22px; flex-wrap: wrap; }
  .gauge { position: fixed; z-index: 5; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: grid; gap: 8px;
    color: var(--deep-text); opacity: 0; transition: opacity 0.5s; pointer-events: none; }
  .gauge b { font: 600 15px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .gauge .label { color: #8DB1C0; font-size: 10px; }

  @media (max-width: 1360px) { .gauge { display: none; } }
  @media (max-width: 1000px) { .grid3, .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .links { display: none; } }
  @media (max-width: 820px) {
    .story-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); align-items: start; gap: 14px; padding-block: 92px 14px; }
    .copy { min-height: 228px; }
    .phone { --ph: calc(100svh - 360px); align-self: center; }
    .hero { gap: 16px; } .hint, .hide-sm { display: none; }
    .step { gap: 12px; } .meter { margin-top: 14px; }
    .h2 { font-size: clamp(34px, 9vw, 52px); }
    .vs, .plans, .stats { grid-template-columns: minmax(0, 1fr); }

const R0 = Math.random;

// ---- the page's own sea: the surface waits at the bottom through the opener, then rises over the page; deeper to the end ----
function startOcean() {
  const cv = document.getElementById('sea'), lc = document.getElementById('life'), ctx = lc.getContext('2d'), gauge = document.getElementById('gauge');
  let quality = 1, slow = 0, wasUnder = false;
  const sea = createSea(cv, () => Math.min(devicePixelRatio || 1, 1.5) * (innerWidth < 700 ? 0.6 : 0.72) * quality);
  if (!sea) document.documentElement.classList.add('nogl');
  const school = new School(8, 11, 30, 96), bubbles = new Bubbles(), glass = REDUCE ? null : new Glass(document.getElementById('glass'));
  S.glass = glass; S.food = [];
  school.fish.forEach(f => { f.tint = f.len < 52 ? 0.5 : f.len < 72 ? 0.25 : 0.06; }); // far fish take on the water's colour (2D fallback)
  startLife3D().then(ok => { S.three = ok; }).catch(e => { S.three = false; console.warn('3D sea off:', e); });
  addEventListener('pointermove', e => { S.mouse.x = e.clientX; S.mouse.y = e.clientY; }, { passive: true });
  addEventListener('pointerdown', e => {
    if (e.target.closest('a, button, .phone, .card')) return;
    if (e.clientY < S.surf) { glass && glass.splash(16, { x: e.clientX - 70, y: e.clientY - 50, w: 140, h: 100 }); return; } // a splash on the glass
    S.rip = [{ x: e.clientX, y: e.clientY, t0: S.t, amp: Math.abs(e.clientY - S.surf) < 140 ? 8 : 0 }, ...S.rip].slice(0, 4);
    bubbles.burst(e.clientX, e.clientY);
    for (let i = 0; i < 7; i++) S.food.push({ x: e.clientX + (R0() - 0.5) * 70, y: e.clientY + (R0() - 0.5) * 30, vy: 10 + R0() * 14, ph: R0() * 6, t: S.t }); // feeding: fish race for flakes
    if (!S.three) school.dart(e.clientX, e.clientY);
  });
  gsap.ticker.add((time, dms) => {
    const dt = Math.min(dms / 1000, 0.1), vw = innerWidth, vh = innerHeight, y = scrollY;
    if (dms > 26) { if (++slow > 45 && quality > 0.55) { quality *= 0.85; slow = 0; } } else slow = Math.max(0, slow - 1); // keep frames short
    S.t = time;
    const ps = S.pinStart, pe = S.pinEnd || vh * 2.6, gone = pe + (vh * 0.84) / 1.2;
    const surf = y <= pe ? vh * (0.9 - (0.06 * Math.max(0, y - ps)) / Math.max(1, pe - ps)) : vh * 0.84 - (y - pe) * 1.2;
    S.surf = surf;
    const end = Math.max(1, document.documentElement.scrollHeight - vh - gone), deepness = Math.min(1, Math.max(0, (y - gone) / end));
    const depth = y < gone ? (Math.max(0, y - pe) / (gone - pe)) * 0.26 : 0.26 + deepness * 0.84;
    S.depth = depth; S.deep = deepness;
    if (sea) sea.draw({ t: REDUCE ? 6 : time, surf, depth, scroll: y, alpha: 1, amp: 1.25, mouse: S.mouse, rip: S.rip });
    if (gauge) { gauge.style.opacity = y > gone - vh * 0.2 ? 1 : 0; gauge.firstChild.nextSibling.textContent = `${Math.round(deepness * 38)} m`; }
    const under = surf < -20;
    if (glass && under && !wasUnder && y > pe) glass.splash(120, { x: 0, y: vh * 0.3, w: vw, h: vh * 0.65 }); // the page goes under: a wave hits the glass
    wasUnder = under;
    const res = Math.min(devicePixelRatio || 1, 2);
    if (lc.width !== Math.round(vw * res) || lc.height !== Math.round(vh * res)) { lc.width = Math.round(vw * res); lc.height = Math.round(vh * res); }
    ctx.setTransform(res, 0, 0, res, 0, 0); ctx.clearRect(0, 0, vw, vh);
    const box = { x0: -40, x1: vw + 40, y0: Math.max(surf + 70, 40), y1: vh - 40 }, room = box.y1 - box.y0 > 160;
    if (!REDUCE) {
      if (!S.three) school.step(dt, time, box, room ? 8 : 0, S.mouse);
      bubbles.step(dt, surf, vw, vh, room);
      S.food = S.food.filter(f => !f.eaten && time - f.t < 14 && f.y < vh + 10);
      for (const f of S.food) { f.y += f.vy * dt; f.x += Math.sin((f.ph += dt * 2)) * dt * 8; }
    }
    if (!S.three) school.draw(ctx, res);
    bubbles.draw(ctx);
    for (const f of S.food) { // flakes, turning as they sink
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ph); ctx.fillStyle = '#F2B65A'; ctx.globalAlpha = Math.min(1, (14 - (time - f.t)) / 2);
      ctx.fillRect(-2.5, -1.6, 5, 3.2); ctx.restore();
    }
    if (glass) { glass.step(dt, vw, vh, y > gone); glass.draw(vw, vh); }
  });
}

// ---- a flood in a box: water (the same shader at 0.8 like FLOOD_OPACITY), fish, sand and the sunken clock ----
function SeaPane({ state, seed = 3, fishN = 10, top = 36, main = false }) {
  const box = useRef(null), glc = useRef(null), fc = useRef(null);
  useEffect(() => {
    const sea = createSea(glc.current, () => Math.min(devicePixelRatio || 1, 2) * 0.8), ctx = fc.current.getContext('2d');
    const school = new School(fishN, seed, 44, 64);
    let level = 0, vis = true;
    const io = new IntersectionObserver(([e]) => { vis = e.isIntersecting; });
    io.observe(box.current);
    const tick = (time, dms) => {
      if (!vis) return;
      const dt = Math.min(dms / 1000, 0.1), s = state.current, W = box.current.clientWidth, H = box.current.clientHeight, k = W / 384;
      level += (s.target - level) * (1 - Math.exp(-dt * (s.target > level ? 2.4 : 1.3))); // rush up, drain slower (Sim.step easing)
      if (main) { S.phone = box.current; S.phoneLevel = level; } // the glass layer spills a full phone onto the page
      const floor = H / k - 14, surfD = floor - level * (floor - top), deep = floor - surfD;
      if (sea) {
        if (level < 0.004) sea.clear();
        else sea.draw({ t: time, surf: surfD * k, depth: 0.06, alpha: 0.8, amp: k * 0.6 * Math.min(1, deep / 48) }); // waves shrink in shallow water (Sim.waveScale)
      }
      const res = Math.min(devicePixelRatio || 1, 2);
      if (fc.current.width !== Math.round(W * res) || fc.current.height !== Math.round(H * res)) { fc.current.width = Math.round(W * res); fc.current.height = Math.round(H * res); }
      ctx.setTransform(res, 0, 0, res, 0, 0); ctx.clearRect(0, 0, W, H); ctx.scale(k, k);
      if (level > 0.004) { // sand along the floor
        ctx.globalAlpha = Math.min(1, level * 10) * 0.85;
        const g = ctx.createLinearGradient(0, floor, 0, floor + 14); g.addColorStop(0, '#F1DFAE'); g.addColorStop(1, '#C9A46A');
        ctx.fillStyle = g; ctx.fillRect(0, floor, 384, 20); ctx.globalAlpha = 1;
      }
      if (s.clock && surfD < floor - 90) { // TankPainter: 104 dp at 60% of the width, 10% into the sand
        ctx.globalAlpha = Math.min(1, (floor - 90 - surfD) / 40);
        SeaPaint.drawClock(ctx, 384 * 0.6 - 52, floor - (104 * 207) / 320 * 0.9, 104, s.clock);
        ctx.globalAlpha = 1;
      }
      school.step(dt, time, { x0: 0, x1: 384, y0: surfD + 36, y1: floor - 50 }, level > 0.12 && !s.leave ? s.fish : 0, null);
      school.draw(ctx, res * k);
    };
    gsap.ticker.add(tick);
    return () => { gsap.ticker.remove(tick); io.disconnect(); };
  }, []);
  return html`<div ref=${box} className="pane" aria-hidden="true"><canvas ref=${glc}></canvas><canvas ref=${fc}></canvas></div>`;
}

    const st = ScrollTrigger.create({
      trigger: sec.current, start: 'top top', end: () => '+=' + Math.round(innerHeight * 2.6), pin: true, scrub: true,
      onUpdate: s => setP(Math.round(s.progress * 1000) / 1000), onRefresh: s => { S.pinStart = s.start; S.pinEnd = s.end; },
    });
    S.pinStart = st.start; S.pinEnd = st.end;
    return () => st.kill();
  }, []);
  const m = storyAt(p), step = STEPS[m.step], wasFlooding = useRef(false);
  Object.assign(pane.current, { target: m.level, fish: m.fish, leave: m.left, clock: m.clock });
  useEffect(() => { // "Flood!": the water hits the screen glass too
    if (m.flooding && !wasFlooding.current) S.glass?.splash(90, { x: 0, y: innerHeight * 0.35, w: innerWidth, h: innerHeight * 0.6 });
    wasFlooding.current = m.flooding;
  }, [m.flooding]);
  const status = m.left ? 'You left · draining' : m.flooding ? `Under water ${mmss(m.under)}` : m.used >= 480 ? 'Warned' : 'Dry';
  return html`<section ref=${sec} className="story" id="top">
    <div className="wrap story-grid">
      <div className="copy">
        <${AnimatePresence} mode="wait" initial=${false}>
          ${m.step < 0 ? html`<${motion.div} key="hero" ...${swap}><${Hero} /><//>` : html`<${motion.div} key=${'s' + m.step} className="step" ...${swap}>
            <div className="label" style=${{ color: 'var(--teal)' }}>${m.step + 1} of 4</div>
            <h2 className="h2">${step[0]}<br /><span className="l2">${step[1]}</span></h2>
            <p className="lead">${step[2]}</p>
          <//>`}
        <//>
        ${m.step >= 0 && html`<div className="meter" aria-label=${`Time in Loop: ${mmss(m.used)} of 10:00`}>
          <div className="meter-row"><span>Loop · this visit</span><span className="t">${mmss(m.used)} / 10:00</span></div>
          <div className="track"><i className=${m.flooding ? 'hot' : ''} style=${{ width: `calc(${(m.used / 600) * 100}% - 6px)` }}></i><b style=${{ left: '90%' }}></b></div>
          <div className="meter-row"><span>The sea comes in at 9:00</span><span>${status}</span></div>
        </div>`}
      </div>
      <${Phone} m=${m} pane=${pane} />
    </div>
  </section>`;
}

// ---- the deep ----
const Head = ({ a, b, lead }) => html`<${motion.div} className="head" initial=${{ y: 46 }} whileInView=${{ y: 0 }} viewport=${{ once: true, margin: '-8%' }}
  transition=${{ type: 'spring', stiffness: 120, damping: 20 }}>
  <h2 className="h2">${a}<br /><span className="l2">${b}</span></h2>${lead && html`<p className="lead">${lead}</p>`}
<//>`;
const rise = i => ({ initial: { y: 56 }, whileInView: { y: 0 }, viewport: { once: true, margin: '-6%' }, transition: { type: 'spring', stiffness: 110, damping: 18, delay: i * 0.07 } });
const lift = REDUCE ? {} : { whileHover: { y: -8, scale: 1.012 }, transition: { type: 'spring', stiffness: 300, damping: 18 } };

function Versus() {
  const still = useRef({ target: 0.64, fish: 4, leave: false, clock: null });
  return html`<section className="sec deep" id="how"><div className="wrap">
    <${Head} a="Not a lockout." b="A rising sea." lead="Taps work by default, a life ring takes you home, and leaving drains it." />
    <div className="vs">
      <${motion.div} className="card vs-card" ...${rise(0)}>
        <div className="label" style=${{ color: '#66737A' }}>A hard lockout</div>
        <div className="shot locked"><${Scaled} w=${360} h=${441}><${PostArt} scene="city" /><//>
          <div className="wall"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
            <b>Time limit reached</b><span>This app is paused until tomorrow.</span></div></div>
        <ul className="ticks no"><li>Your taps stop working</li><li>You bargain for more time, or switch it off</li></ul>
      <//>
      <${motion.div} className="card vs-card" ...${rise(1)}>
        <div className="label" style=${{ color: 'var(--teal)' }}>SeaThrough</div>
        <div className="shot"><${Scaled} w=${360} h=${441}><${PostArt} scene="city" /><//><${SeaPane} state=${still} seed=${9} fishN=${4} top=${10} /></div>
        <ul className="ticks"><li>Your taps still reach the app</li><li>Home and Back always work</li><li>Leave, and the water drains</li></ul>
      <//>
    </div>
  </div></section>`;
}

const FEATS = [
  ['Free', 'Talking fish', 'Fish speak up with your own numbers: days a year, hours this week. One line per flood for free, the whole school with Pro.',
    () => html`<${FishArt} kind="clownfish" len=${96} w=${150} h=${100} /><div className="bubble">Blub blub. At this rate, 31 days a year in Loop.</div>`],
  ['Every flood', 'Golden fish', 'A golden fish swims through every flood. With Pro, one tap on it takes you to an app you chose instead.',
    () => html`<div className="medal"><${AppIcon} app="pictura" size=${54} /></div>`],
  ['Free', 'Life ring', 'Tap the life ring and you land on your home screen. Leaving drains the sea.', () => html`<i className="ring" style=${{ transform: 'scale(1.35) rotate(-14deg)' }}></i>`],
  ['Free', 'The gate', 'Reopen a flooded app and SeaThrough asks first, with the wait left on screen: not now, or open it flooded.',
    () => html`<div className="gate"><small>Loop is still under water</small><b>8 min</b><div><span>Not now</span><span>Open Loop flooded</span></div></div>`],
  ['Free', 'Sunken clock', 'A clock half buried in the sand counts how long you have been under water, even across short trips away.', () => html`<${ClockArt} w=${150} />`],
  ['Pro', 'Riptide', 'Stricter, when you choose. Riptide takes your taps on apps you pick. “Let me in” waits 30 s, then lets you in for 5 minutes, 3 times a day.',
    () => html`<div className="lmi"><span>Let me in</span><small>30 s</small></div>`],
];
function Features() {
  return html`<section className="sec deep" id="features"><div className="wrap">
    <${Head} a="Everything in the water" b="has a job." lead="Each part of the flood nudges you out of the app, and none of it traps you in." />
    <div className="grid3">${FEATS.map(([tag, title, body, viz], i) => html`<${motion.article} key=${title} className="card feat" ...${rise(i % 3)} ...${lift}>
      <div className="viz">${viz()}</div>
      <span className=${'tag' + (tag === 'Pro' ? ' pro' : '')}>${tag}</span>
      <h3 className="h3">${title}</h3><p>${body}</p>
    <//>`)}</div>
  </div></section>`;
}

function Science() {
  const rows = [
    ['37%', 'fewer attempts to open a target app over six weeks, with a short pause before it opened', 'Field study · PNAS 2023 · 280 people · no control group'],
    ['20+ min', 'less phone time a day once the screen turned grey', 'Two studies · 2020 and 2024'],
    ['More frustration', 'Hard lockouts cut more use than warnings, but frustrated people more', 'Field study · IMWUT 2019 · 36 people'],
  ];
  return html`<section className="sec deep" id="science"><div className="wrap">
    <${Head} a="Friction helped." b="Walls frustrated." lead="Studies of other screen-time tools, not of SeaThrough." />
    <div className="stats">${rows.map(([n, text, src], i) => html`<${motion.div} key=${n} className="stat" ...${rise(i)}>
      <div className=${'num' + (n.length > 8 ? ' word' : '')}>${n}</div><p>${text}</p><small>${src}</small>
    <//>`)}</div>
  </div></section>`;
}

function Privacy() {
  const facts = [
    ['On the phone', 'Usage access tells SeaThrough which app is open, every 2 seconds. That record stays on your phone.'],
    ['No account', 'Nothing to sign up for. No ads, ever, and no Accessibility service.'],
    ['Google Play only', 'The only internet use is Google Play Billing, for Pro.'],
  ];
  return html`<section className="sec deep" id="privacy"><div className="wrap">
    <${Head} a="Your usage stays" b="on your phone" lead="No account. No ads. Purchases go through Google Play." />
    <div className="facts">${facts.map(([t, b], i) => html`<${motion.div} key=${t} className="card" ...${rise(i)}><h3 className="h3">${t}</h3><p>${b}</p><//>`)}</div>
    <p className="lead" style=${{ marginTop: '28px' }}><a href=${PRIVACY} target="_blank" rel="noopener">Read the privacy policy</a></p>
  </div></section>`;
}

function Pricing() {
  return html`<section className="sec deep" id="pricing"><div className="wrap">
    <${Head} a="Two apps free." b="Every app with Pro." lead="Pro starts with a 7-day free trial on the yearly plan. Prices are in euros; Google Play shows yours." />
    <div className="plans">
      <${motion.div} className="card plan" ...${rise(0)}>
        <span className="tag">Free</span>
        <div className="price"><span className="num">€0</span><span className="sub">for good</span></div>
        <ul className="ticks"><li>2 apps flood</li><li>Warnings and the 10-second countdown</li><li>The gate, the life ring and the sunken clock</li><li>One talking-fish line per flood</li><li>The golden fish swims by</li></ul>
      <//>
      <${motion.div} className="card plan pro" ...${rise(1)}>
        <span className="tag" style=${{ background: 'rgb(255 255 255 / 0.2)', color: '#fff' }}>Pro</span>
        <div className="price"><span className="num">€29.99</span><span className="sub">a year, after 7 days free</span></div>
        <p className="sub">or €6.49 a month, or €39.99 once</p>
        <ul className="ticks"><li>Every app you limit</li><li>The whole talking school</li><li>The golden fish takes you to apps you pick</li><li>Riptide, for the apps you choose</li><li>Thicker water the longer you stay</li><li>Time back, and a reef that grows on dry days</li></ul>
      <//>
    </div>
  </div></section>`;
}

function Final() {
  return html`<section className="final deep"><div className="wrap center">
    <h2 className="h2" style=${{ fontSize: 'clamp(48px, 8vw, 120px)' }}>Overstay.<br /><span className="l2">The sea comes in.</span></h2>
    <p className="lead">Free for 2 apps. Pro adds every app, Riptide and the rest of the school.</p>
    <${Clay} href=${PLAY} icon=${PlayIcon}>Get it on Google Play<//>
  </div>
  <div className="wrap"><footer className="foot">
    <span>SeaThrough by Mindylabs, Berlin · Android only</span>
    <nav><a href=${PRIVACY} target="_blank" rel="noopener">Privacy policy</a><span>Google Play is a trademark of Google LLC.</span></nav>
  </footer></div></section>`;
}

function Nav() {
  return html`<header className="nav"><div className="wrap"><div className="bar">
    <a className="brand" href="#top"><${Logo} size=${36} /><span>SeaThrough</span></a>
    <nav className="links" aria-label="Sections"><a href="#how">How it works</a><a href="#features">Features</a><a href="#privacy">Privacy</a><a href="#pricing">Pricing</a></nav>
    <span className="grow"></span>
    <${Clay} href=${PLAY} small=${true}>Get the app<//>
  </div></div></header>`;
}

function App() {
  useEffect(() => {
    startOcean();
    document.fonts.ready.then(() => ScrollTrigger.refresh());
  }, []);
  return html`<${React.Fragment}>
    <${Nav} />
    <main><${Story} /><${Versus} /><${Features} /><${Science} /><${Privacy} /><${Pricing} /><${Final} /></main>
    <div className="gauge" id="gauge" aria-hidden="true"><span className="label">Depth</span><b>0 m</b></div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
